<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shravani's Login</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow-x: hidden;
            position: relative;
        }

        /* Fabric Wave Background Animation */
        body::before {
            content: '';
            position: absolute;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,105,180,0.05) 10%, transparent 20%);
            background-size: 30px 30px;
            animation: fabricMove 20s linear infinite;
            z-index: 0;
        }

        @keyframes fabricMove {
            0% { transform: translate(0, 0); }
            100% { transform: translate(-50px, -50px); }
        }

        .login-container {
            background: #ffffff;
            width: 100%;
            max-width: 420px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            position: relative;
            z-index: 1;
            transform: translateY(30px);
            opacity: 0;
            animation: slideUp 0.8s ease forwards;
        }

        @keyframes slideUp {
            to { transform: translateY(0); opacity: 1; }
        }

        /* Tailor Stitch Line Animation */
        .stitch-line {
            height: 4px;
            background: repeating-linear-gradient(90deg, #ff4081, #ff4081 10px, transparent 10px, transparent 20px);
            animation: stitch 2s linear infinite;
        }

        @keyframes stitch {
            0% { background-position: 0 0; }
            100% { background-position: 40px 0; }
        }

        .form-header {
            text-align: center;
            padding: 30px 20px 10px 20px;
        }

        .logo-img {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #ff4081;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            transition: transform 0.3s ease;
        }

        .logo-img:hover { transform: rotate(360deg); }

        h2 {
            color: #333;
            margin-top: 10px;
            font-size: 1.5rem;
            letter-spacing: 1px;
        }

        form {
            padding: 20px 25px 30px 25px;
        }

        .input-group {
            position: relative;
            margin-bottom: 20px;
        }

        .input-group i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #000000;
            font-size: 1.1rem;
            z-index: 2;
        }

        .input-group input {
            width: 100%;
            padding: 12px 12px 12px 45px;
            border: 1px solid #ccc;
            border-radius: 8px;
            outline: none;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .input-group input:focus {
            border-color: #ff4081;
            box-shadow: 0 0 8px rgba(255, 64, 129, 0.2);
        }

        .input-group label {
            position: absolute;
            left: 45px;
            top: 50%;
            transform: translateY(-50%);
            color: #aaa;
            transition: all 0.3s ease;
            pointer-events: none;
            z-index: 2;
        }

        .input-group input:focus ~ label,
        .input-group input:not(:placeholder-shown) ~ label {
            top: -10px;
            left: 10px;
            font-size: 0.8rem;
            padding: 0 5px;
            background: #fff;
            color: #ff4081;
        }

        .btn-submit {
            width: 100%;
            padding: 12px;
            background: #ff4081;
            border: none;
            color: white;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.3s ease, transform 0.1s ease;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .btn-submit:hover { background: #e91e63; }
        .btn-submit:active { transform: scale(0.98); }

        .forgot-link {
            display: block;
            text-align: center;
            margin-top: 15px;
            color: #757575;
            text-decoration: none;
            font-size: 0.9rem;
        }
        .forgot-link:hover { color: #ff4081; text-decoration: underline; }

        /* --- INTERACTIVE 4-WHEEL LOADER SCREEN --- */
        .loading-screen {
            display: none; /* ಆರಂಭದಲ್ಲಿ ಹೈಡ್ ಆಗಿರುತ್ತದೆ */
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #f0ebe1;
            z-index: 999;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .machine-container {
            position: relative;
            width: 450px;
            height: 300px;
            background: #fdfbf7;
            border-radius: 12px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.05);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .wheels-system {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0; left: 0;
            pointer-events: none;
        }

        .wheel {
            position: absolute;
            border: 4px dashed #4a4a4a;
            border-top-color: #111;
            border-bottom-color: #111;
            border-radius: 50%;
            background: radial-gradient(circle, #cbd5e1 20%, #94a3b8 60%, #64748b 100%);
            box-shadow: inset 0 0 8px rgba(0,0,0,0.3), 0 4px 6px rgba(0,0,0,0.1);
            animation: spin 1.5s linear infinite;
        }

        .wheel::before {
            content: ''; position: absolute; top: 50%; left: 50%;
            width: 85%; height: 2px; background: #4a4a4a; transform: translate(-50%, -50%);
        }
        .wheel::after {
            content: ''; position: absolute; top: 50%; left: 50%;
            width: 2px; height: 85%; background: #4a4a4a; transform: translate(-50%, -50%);
        }

        .wheel-1 { width: 70px; height: 70px; top: 40px; right: 50px; animation-duration: 1.2s; }
        .wheel-2 { width: 45px; height: 45px; top: 45px; left: 120px; animation-duration: 1.2s; }
        .wheel-3 { width: 50px; height: 50px; bottom: 55px; right: 70px; animation-duration: 0.8s; animation-direction: reverse; }
        .wheel-4 { width: 30px; height: 30px; top: 90px; left: 160px; animation-duration: 0.6s; }

        .needle-assembly { position: absolute; top: 30px; left: 125px; width: 40px; height: 140px; }
        
        .needle-bar {
            position: absolute; top: 0; left: 18px; width: 6px; height: 90px;
            background: linear-gradient(to right, #94a3b8, #e2e8f0, #475569);
            animation: reciprocate 0.6s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
        }

        .needle {
            position: absolute; bottom: -30px; left: 1px; width: 4px; height: 35px;
            background: linear-gradient(to right, #cbd5e1, #ffffff, #64748b);
            clip-path: polygon(0% 0%, 100% 0%, 100% 70%, 50% 100%, 0% 70%);
        }

        .needle::after {
            content: ''; position: absolute; bottom: 6px; left: 50%;
            transform: translateX(-50%); width: 1.5px; height: 6px; background-color: #1e293b; border-radius: 50%;
        }

        .dynamic-thread {
            position: absolute; top: 35px; left: 144px; width: 2px; height: 90px;
            background-color: #ef4444; transform-origin: top center; z-index: 2;
            animation: thread-stretch 0.6s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
        }

        .workbed { position: absolute; bottom: 75px; width: 85%; height: 8px; background: #334155; border-radius: 4px; z-index: 4; }
        .fabric-conveyor { position: absolute; bottom: 83px; width: 80%; height: 16px; overflow: hidden; z-index: 3; }
        
        .fabric {
            width: 200%; height: 100%;
            background: repeating-linear-gradient(45deg, #0d9488, #0d9488 10px, #0f766e 10px, #0f766e 20px);
            border-radius: 3px 3px 0 0; animation: feed-fabric 4s linear infinite;
        }

        .stitch-svg-layer { position: absolute; bottom: 83px; left: 10%; width: 80%; height: 16px; z-index: 5; pointer-events: none; }
        .stitch-path { stroke: #ef4444; stroke-width: 2.5; stroke-linecap: round; stroke-dasharray: 8, 8; animation: move-stitches 4s linear infinite; }

        /* ನಿಮ್ಮ ಲಾಗಿನ್ ಸ್ಟೇಟಸ್ ಮೆಸೇಜ್ ಶೈಲಿ */
        .status-text {
            position: absolute;
            bottom: 25px;
            font-size: 14px;
            font-weight: 700;
            color: #e91e63;
            text-align: center;
            line-height: 1.5;
            padding: 0 15px;
        }

        /* --- KEYFRAME ANIMATIONS --- */
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        @keyframes reciprocate { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(42px); } }
        @keyframes thread-stretch { 0%, 100% { height: 85px; transform: rotate(0deg); } 50% { height: 126px; transform: rotate(-3deg); } }
        @keyframes feed-fabric { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } }
        @keyframes move-stitches { 0% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: -360; } }

        /* Forgot Password Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 10;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .modal-content {
            background: white;
            padding: 25px;
            border-radius: 12px;
            width: 100%;
            max-width: 360px;
            position: relative;
        }
        .close-btn { position: absolute; right: 15px; top: 10px; font-size: 1.5rem; cursor: pointer; }

        @media (max-width: 480px) {
            .login-container { max-width: 100%; margin: 10px; }
            .machine-container { width: 95%; height: auto; min-height: 300px; }
        }
    </style>
</head>
<body>

    <div class="loading-screen" id="loaderScreen">
        <div class="machine-container">
            <div class="wheels-system">
                <div class="wheel wheel-1"></div>
                <div class="wheel wheel-2"></div>
                <div class="wheel wheel-4"></div>
                <div class="wheel wheel-3"></div>
            </div>

            <div class="dynamic-thread" id="thread"></div>

            <div class="needle-assembly">
                <div class="needle-bar">
                    <div class="needle"></div>
                </div>
            </div>

            <div class="fabric-conveyor">
                <div class="fabric"></div>
            </div>

            <svg class="stitch-svg-layer">
                <line x1="0" y1="3" x2="1000" y2="3" class="stitch-path" />
            </svg>

            <div class="workbed"></div>

            <div class="status-text" id="statusMessage">Verifying Tailored Metrics...</div>
        </div>
    </div>

    <div class="login-container" id="loginWrapper">
        <div class="stitch-line"></div>
        <div class="form-header">
            <img src="slt.jpg" alt="SLT Logo" class="logo-img" onerror="this.style.display='none';">
            <h2>Shravani's Login</h2>
        </div>

        <form id="loginForm">
            <div class="input-group">
                <i class="fa-solid fa-user"></i>
                <input type="text" id="username" placeholder=" " required>
                <label>Username</label>
            </div>
            
            <div class="input-group">
                <i class="fa-solid fa-phone"></i>
                <input type="text" id="phone" inputmode="numeric" oninput="this.value = this.value.replace(/[^0-9]/g, '');" placeholder=" " required>
                <label>Phone Number</label>
            </div>
            
            <div class="input-group">
                <i class="fa-solid fa-envelope"></i>
                <input type="email" id="email" placeholder=" " required>
                <label>Email Address</label>
            </div>
            
            <div class="input-group">
                <i class="fa-solid fa-lock"></i>
                <input type="password" id="password" placeholder=" " required>
                <label>Password</label>
            </div>

            <button type="submit" class="btn-submit">Login</button>
            <a href="#" class="forgot-link" id="openForgotModal">Forgot Password?</a>
        </form>
    </div>

    <div class="modal" id="forgotModal">
        <div class="modal-content">
            <span class="close-btn" id="closeForgotModal">&times;</span>
            <h3 style="margin-bottom:15px; color:#333;">Reset Password</h3>
            <form id="forgotForm" style="padding:0;">
                <div class="input-group">
                    <i class="fa-solid fa-user"></i>
                    <input type="text" id="reset_username" placeholder=" " required>
                    <label>Your Username</label>
                </div>
                <div class="input-group">
                    <i class="fa-solid fa-key"></i>
                    <input type="password" id="new_password" placeholder=" " required>
                    <label>New Password (Max 8 chars)</label>
                </div>
                <button type="submit" class="btn-submit">Update Password</button>
            </form>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-app.js";
        import { getDatabase, ref, child, get, set, update } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDlUWMxE24zT0jIJidlIqReR9eJEUnoCqY",
            authDomain: "shravaniladiestailor-41471.firebaseapp.com",
            projectId: "shravaniladiestailor-41471",
            storageBucket: "shravaniladiestailor-41471.firebasestorage.app",
            messagingSenderId: "835359767338",
            appId: "1:835359767338:web:9ae45c8f69177490c6bc53",
            measurementId: "G-VXCYECLKK7"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // UI References
        const loaderScreen = document.getElementById('loaderScreen');
        const statusMessage = document.getElementById('statusMessage');
        const modal = document.getElementById('forgotModal');
        const needleBar = document.querySelector('.needle-bar');
        const thread = document.getElementById('thread');

        // Micro-timing mechanical adjustments for needle resistance
        if (needleBar && thread) {
            needleBar.addEventListener('animationiteration', () => {
                const randomVariance = (Math.random() * 0.15 + 0.55).toFixed(2);
                needleBar.style.animationDuration = `${randomVariance}s`;
                thread.style.animationDuration = `${randomVariance}s`;
            });
        }

        // Forgot Modal Toggle
        document.getElementById('openForgotModal').addEventListener('click', (e) => { e.preventDefault(); modal.style.display = 'flex'; });
        document.getElementById('closeForgotModal').addEventListener('click', () => { modal.style.display = 'none'; });

        // --- HANDLE SUBMIT (AUTOMATIC SAVE & STITCH REDIRECT) ---
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const userVal = document.getElementById('username').value.trim();
            const phoneVal = document.getElementById('phone').value.trim();
            const emailVal = document.getElementById('email').value.trim();
            const passVal = document.getElementById('password').value;

            // 1. ಹೊಲಿಗೆ ಯಂತ್ರದ ಲೋಡಿಂಗ್ ಸ್ಕ್ರೀನ್ ಓಪನ್ ಮಾಡುವುದು
            loaderScreen.style.display = 'flex';
            statusMessage.innerHTML = "Verifying with Shravani's Server...";

            const dbRef = ref(db);
            
            get(child(dbRef, `users/${userVal}`)).then((snapshot) => {
                if (snapshot.exists()) {
                    const userData = snapshot.val();
                    
                    if (userData.password === passVal) {
                        // ಯೂಸರ್ ಇದ್ದರೆ ಯಶಸ್ವಿ ಲಾಗಿನ್ ಸಂದೇಶ
                        statusMessage.innerHTML = "Login is successful!<br>But don't forget login information.";
                        
                        // 3.5 ಸೆಕೆಂಡ್ ಮೆಷಿನ್ ರನ್ ಆದ ನಂತರ ಆಟೋಮ್ಯಾಟಿಕ್ ಆಗಿ ಹೋಮ್ ಪೇಜ್‌ಗೆ ಹೋಗುತ್ತದೆ
                        setTimeout(() => {
                            window.location.href = "home.html";
                        }, 3500);

                    } else {
                        loaderScreen.style.display = 'none';
                        alert("Login Rejected: Incorrect password!");
                    }
                } else {
                    // ಹೊಸ ಯೂಸರ್ ಆಗಿದ್ದರೆ ಡೇಟಾಬೇಸ್‌ನಲ್ಲಿ ಆಟೋಮ್ಯಾಟಿಕ್ ಆಗಿ ಸೇವ್ ಮಾಡುತ್ತದೆ
                    set(ref(db, 'users/' + userVal), {
                        username: userVal,
                        phone: phoneVal,
                        email: emailVal,
                        password: passVal
                    }).then(() => {
                        statusMessage.innerHTML = "Profile Saved Successfully!<br>Please remember your login details.";
                        
                        setTimeout(() => {
                            window.location.href = "home.html";
                        }, 3500);
                    }).catch((err) => {
                        loaderScreen.style.display = 'none';
                        alert("Error saving data: " + err.message);
                    });
                }
            }).catch((error) => {
                loaderScreen.style.display = 'none';
                alert("Database Error: " + error.message);
            });
        });

        // --- FORGOT PASSWORD PROCESS ---
        document.getElementById('forgotForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const userVal = document.getElementById('reset_username').value.trim();
            const newPass = document.getElementById('new_password').value;

            if (newPass.length > 8) {
                alert("Error: Password must not exceed 8 characters!");
                return;
            }

            const dbRef = ref(db);
            get(child(dbRef, `users/${userVal}`)).then((snapshot) => {
                if (snapshot.exists()) {
                    const updates = {};
                    updates[`users/${userVal}/password`] = newPass;
                    
                    update(ref(db), updates).then(() => {
                        alert("Success: Password updated successfully!");
                        modal.style.display = 'none';
                        document.getElementById('forgotForm').reset();
                    });
                } else {
                    alert("Error: Username does not exist!");
                }
            }).catch((error) => {
                alert("Error updating password: " + error.message);
            });
        });
    </script>
</body>
</html>
